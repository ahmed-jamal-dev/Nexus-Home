version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:2.17.0-pg16
    container_name: nexus-home-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_home
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_home"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c log_statement=all
      -c log_destination=stderr

  redis:
    image: redis:7-alpine
    container_name: nexus-home-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  nexus_postgres_data:
    driver: local
    name: nexus_home_postgres_data
  nexus_redis_data:
    driver: local
    name: nexus_home_redis_data