version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:2.17.0-pg16
    container_name: nexus-home-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_home
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_home"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c log_statement=all
      -c log_destination=stderr

volumes:
  nexus_postgres_data:
    driver: local
    name: nexus_home_postgres_data